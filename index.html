<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Atheneu — Sua biblioteca. Sua leitura. Seu conhecimento.</title>
    <meta
      name="description"
      content="Atheneu é uma biblioteca digital pessoal: leia, escute, anote, conecte ideias e acompanhe sua evolução intelectual."
    />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#f5f0e6" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,300..700;1,8..60,300..700&display=swap"
      rel="stylesheet"
    />
    <!-- Restauração de rota SPA após o redirect 404 do GitHub Pages.
         A troca real da URL acontece em src/main.tsx (depois que os assets
         relativos já foram resolvidos), para não quebrar caminhos relativos. -->
    <script>
      (function () {
        try {
          var redirect = sessionStorage.getItem('atheneu-redirect');
          if (redirect) {
            sessionStorage.removeItem('atheneu-redirect');
            window.__ATHENEU_RESTORE__ = redirect;
          }
        } catch (e) {}
      })();
    </script>
    <!-- Tema antes da pintura (evita flash de tema errado) -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('atheneu-theme');
          if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
